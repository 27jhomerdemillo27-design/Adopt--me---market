<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Adopt Me Market</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}body{background:#f5edff;margin:0;padding:20px 15px;display:flex;justify-content:center}.container{width:100%;max-width:450px}.header{text-align:center;margin-bottom:25px}.header h1{color:#6b21a8;font-size:28px;margin:0 0 8px;font-weight:800}.header p{color:#374151;margin:0;font-size:15px}.section-title{color:#7e22ce;font-size:20px;font-weight:700;margin-bottom:15px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 15px rgba(126,34,206,.08);margin-bottom:20px}.product-name{color:#581c87;font-size:20px;font-weight:700;margin-bottom:12px}.category{color:#111827;font-size:15px;margin-bottom:16px}.option-group{margin-bottom:16px}.option-label{font-weight:700;color:#111827;margin-bottom:8px;font-size:15px}.btn-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}.btn-opt{background:#c084fc;color:#fff;border:0;padding:8px 16px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer}.btn-opt.active{background:#581c87}.selected-status{color:#7e22ce;font-size:14px;font-weight:600;margin-top:6px}.price-tag{color:#6b21a8;font-size:20px;font-weight:800;margin:20px 0 15px}.btn-buy{background:#6b21a8;color:#fff;border:0;padding:10px 22px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}.modal-overlay{display:none;position:fixed;inset:0;background:#0008;justify-content:center;align-items:center;padding:15px;z-index:1000}.modal-card{background:#fff;padding:24px;border-radius:18px;width:100%;max-width:400px;text-align:center}.gcash-box{background:#e8f3ff;border:2px solid #007dfe;padding:12px;border-radius:12px;margin:12px 0;text-align:left}.gcash-title{color:#007dfe;font-weight:bold}.copy-btn{background:#007dfe;color:#fff;border:0;padding:6px 12px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:6px}.chat-box{background:#f9f5ff;border:1px solid #e0d0f0;border-radius:10px;padding:10px;text-align:left}.modal-card input{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px}.modal-btns{display:flex;gap:10px;margin-top:10px}.btn-submit,.btn-cancel{flex:1;border:0;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer}.btn-submit{background:#6b21a8;color:#fff}.btn-cancel{background:#e5e7eb;color:#374151}
</style></head><body><div class="container"><div class="header"><h1>Adopt Me Market</h1><p>Welcome to our Buy and Sell Marketplace!</p></div><div class="section-title">Available Products</div><div id="products"></div></div>
<div class="modal-overlay" id="checkoutModal"><div class="modal-card"><h3>Complete Your Order</h3><div id="orderSummary" style="text-align:left;background:#f9f5ff;padding:12px;border-radius:12px;margin-bottom:12px;font-size:14px"></div><div class="gcash-box"><div class="gcash-title">💙 GCash Payment</div><div><b>Account Name:</b> John Jhomer Maminta</div><div><b>Number:</b> <span id="gcashNumber" style="font-weight:bold;color:#007dfe">09970789428</span></div><button class="copy-btn" onclick="copyGCashNumber()">📋 Copy GCash Number</button></div><div class="chat-box"><label><b>Roblox Username:</b></label><input id="robloxUser" placeholder="Enter your Roblox username..."><label><b>Message / GCash Ref No:</b></label><input id="userMsg" placeholder="e.g. Ref No. 1234567..."></div><div class="modal-btns"><button class="btn-submit" onclick="sendOrderToTelegram()">Send Message to Seller</button><button class="btn-cancel" onclick="closeCheckout()">Cancel</button></div></div></div>
<script>
// SECURITY: the Telegram bot token is intentionally not included in this public HTML file.
// A public website must use a server/backend to keep the bot token private.
const TELEGRAM_BOT_TOKEN="PUT_NEW_TOKEN_ON_SERVER";const TELEGRAM_CHAT_ID="5029595435";
const normalAges=["Newborn","Junior","Pre-Teen","Teen","Post-Teen","Full Grown"],neonAges=["Reborn","Twinkle","Sparkle","Flare","Sunshine","Luminous"];
const pets={ancient:{name:"Ancient Dragon",variant:"Normal",age:"Newborn",fly:false,ride:false,price:5},phoenix:{name:"Phoenix",variant:"Normal",age:"Newborn",fly:false,ride:false,price:15},quetzal:{name:"Quetzalcoatl",variant:"Normal",age:"Newborn",fly:false,ride:false,price:5}};let currentActivePet="";
function card(k){let p=pets[k];return `<div class="card"><div class="product-name">${p.name}</div><div class="category">Category: Pet</div><div class="option-group"><div class="option-label">Variant:</div><div class="btn-group"><button class="btn-opt active" id="${k}Normal" onclick="selectVariant('${k}','Normal')">Normal</button><button class="btn-opt" id="${k}Neon" onclick="selectVariant('${k}','Neon')">Neon</button><button class="btn-opt" id="${k}Mega" onclick="selectVariant('${k}','Mega')">Mega</button></div><div class="selected-status" id="${k}Variant">Variant: Normal</div></div><div class="option-group"><div class="option-label">Age:</div><div class="btn-group" id="${k}AgeContainer"></div><div class="selected-status" id="${k}Age">Age: Newborn</div></div><div class="option-group"><div class="option-label">Fly / Ride:</div><div class="btn-group"><button class="btn-opt" id="${k}Fly" onclick="toggleFly('${k}')">Fly</button><button class="btn-opt" id="${k}Ride" onclick="toggleRide('${k}')">Ride</button></div><div class="selected-status" id="${k}FlyRide">Fly/Ride: Normal</div></div><div class="price-tag" id="${k}Price">Price: ₱${p.price}</div><button class="btn-buy" onclick="openCheckout('${k}')">Buy Now</button></div>`}document.getElementById('products').innerHTML=['ancient','phoenix','quetzal'].map(card).join('');
function ages(k){return pets[k].variant==='Mega'?[]:pets[k].variant==='Neon'?neonAges:normalAges}function selectVariant(k,v){let old=pets[k].variant;pets[k].variant=v;if(v==='Mega')pets[k].age='Fully Aged';else if(v==='Neon'){let i=normalAges.indexOf(pets[k].age);pets[k].age=i>=0?neonAges[i]:'Reborn'}else{let i=neonAges.indexOf(pets[k].age);pets[k].age=i>=0?normalAges[i]:'Newborn'}document.getElementById(k+'Variant').innerText='Variant: '+v;document.getElementById(k+'Age').innerText='Age: '+pets[k].age;update(k)}function selectAge(k,a){pets[k].age=a;update(k)}function toggleFly(k){pets[k].fly=!pets[k].fly;update(k)}function toggleRide(k){pets[k].ride=!pets[k].ride;update(k)}
function update(k){let p=pets[k],f=p.fly,r=p.ride;document.getElementById(k+'Age').innerText='Age: '+p.age;document.getElementById(k+'FlyRide').innerText='Fly/Ride: '+(f&&r?'Fly Ride':f?'Fly':r?'Ride':'Normal');['Fly','Ride'].forEach(x=>document.getElementById(k+x).classList.toggle('active',x==='Fly'?f:r));['Normal','Neon','Mega'].forEach(x=>document.getElementById(k+x).classList.toggle('active',p.variant===x));document.getElementById(k+'AgeContainer').innerHTML=ages(k).map(a=>`<button class="btn-opt ${p.age===a?'active':''}" onclick="selectAge('${k}','${a}')">${a}</button>`).join('');price(k)}
function price(k){let p=pets[k],full=p.age==='Full Grown'||p.age==='Luminous',x=0;if(k==='ancient'){if(p.variant==='Normal'){x=full?10:5;x+=p.fly&&p.ride?25:p.fly?15:p.ride?10:0}else if(p.variant==='Neon'){x=20+p.fly&&p.ride?15:0;x=20+(p.fly&&p.ride?15:p.fly?10:p.ride?5:0)+(full?5:0)}else x=p.fly&&p.ride?60:p.ride?40:p.fly?50:35}else if(k==='phoenix'){if(p.variant==='Normal')x=(full?20:15)+(p.fly&&p.ride?25:p.fly?15:p.ride?10:0);else if(p.variant==='Neon')x=(p.fly&&p.ride?150:p.fly?115:p.ride?100:80)+(full?10:0);else x=p.fly&&p.ride?420:p.ride?380:p.fly?390:340}else{if(p.variant==='Normal')x=(full?8:5)+(p.fly&&p.ride?25:p.fly?15:p.ride?10:0);else if(p.variant==='Neon')x=(p.fly&&p.ride?60:p.fly?40:p.ride?30:20)+(full?5:0);else x=p.fly&&p.ride?130:p.ride?85:p.fly?90:40}p.price=x;document.getElementById(k+'Price').innerText='Price: ₱'+x}
function openCheckout(k){currentActivePet=k;let p=pets[k],pot=p.fly&&p.ride?'Fly Ride (FR)':p.fly?'Fly Only (F)':p.ride?'Ride Only (R)':'Normal';document.getElementById('orderSummary').innerHTML=`<div><b>Pet:</b> ${p.name}</div><div><b>Variant:</b> ${p.variant}</div><div><b>Age:</b> ${p.age}</div><div><b>Potion:</b> ${pot}</div><div style="font-size:16px;color:#6b21a8;margin-top:5px"><b>Total Price: ₱${p.price}</b></div>`;document.getElementById('checkoutModal').style.display='flex'}function closeCheckout(){document.getElementById('checkoutModal').style.display='none'}function copyGCashNumber(){let n=document.getElementById('gcashNumber').innerText;navigator.clipboard.writeText(n);alert('GCash Number ('+n+') Copied!')}
async function sendOrderToTelegram(){alert('Telegram sending needs a secure backend so your bot token is not exposed publicly.');}
['ancient','phoenix','quetzal'].forEach(update);
</script></body></html>
